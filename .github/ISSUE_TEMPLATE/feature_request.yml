name: Feature request
description: Suggest an idea or a new appliance profile
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would you like to achieve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection (radiant cooktop)
        - New appliance profile (oven, induction, ...)
        - Learning / labels
        - Configuration / UI
        - Documentation
        - Other
  - type: textarea
    id: data
    attributes:
      label: Data
      description: If possible attach an anonymised training data export (service herdwaechter.export_training_data). It contains feature vectors only, no raw data, no timestamps, no entity IDs.
